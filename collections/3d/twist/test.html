<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Carousel</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <link rel="stylesheet" href="../../../css/work.css">
    <script src="../../../scripts/main.js" defer></script>
</head>
<body>
    <main class="work-container">
        <div class="work-carousel">
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-slide active">
                        <img src="images/twist-1.jpg" alt="Twist - Main View">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/twist-2.jpg" alt="Twist - View 2">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/twist-3.jpg" alt="Twist - View 3">
                    </div>
                    <div class="carousel-slide">
                        <img src="images/twist-4.jpg" alt="Twist - View 4">
                    </div>
                </div>
                <button class="carousel-nav prev" aria-label="Previous image">&lt;</button>
                <button class="carousel-nav next" aria-label="Next image">&gt;</button>
            </div>
            <div class="carousel-indicators">
                <button class="indicator active" data-slide="0"></button>
                <button class="indicator" data-slide="1"></button>
                <button class="indicator" data-slide="2"></button>
                <button class="indicator" data-slide="3"></button>
            </div>
        </div>
    </main>

    <script>
        // Simple test to see if elements are found
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Test page loaded');
            const carousel = document.querySelector('.carousel-track');
            const slides = document.querySelectorAll('.carousel-slide');
            console.log('Found carousel:', !!carousel);
            console.log('Found slides:', slides.length);
        });
    </script>
</body>
</html>
